services:
  timetable:
    build: .
    container_name: share-timetable
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
    expose:
      - "3000"
    volumes:
      - timetable_data:/app/data

  quick-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: share-timetable-quick-tunnel
    profiles: ["quick"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://timetable:3000
    depends_on:
      timetable:
        condition: service_healthy

volumes:
  timetable_data:
